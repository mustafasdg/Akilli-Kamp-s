<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISUBÜ Admin Panel — Akıllı Kampüs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1D4ED8;
      --primary-dark: #1E3A8A;
      --primary-light: #DBEAFE;
      --bg: #F1F5F9;
      --surface: #fff;
      --surface-alt: #F8FAFC;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-2: #475569;
      --text-muted: #94A3B8;
      --success: #10B981;
      --success-light: #D1FAE5;
      --error: #EF4444;
      --error-light: #FEE2E2;
      --warning: #F59E0B;
      --radius: 12px;
      --sidebar: 240px;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: var(--sidebar);
      background: var(--text);
      display: flex; flex-direction: column;
      z-index: 100;
    }
    .sidebar-logo {
      padding: 20px 20px 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sidebar-logo span { font-size: 28px; }
    .sidebar-logo-text { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.3; }
    .sidebar-logo-text small { font-size: 11px; color: var(--text-muted); font-weight: 400; display: block; }

    .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px;
      color: rgba(255,255,255,.65); font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all .15s; user-select: none;
    }
    .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav-item.active { background: var(--primary); color: #fff; }
    .nav-item .nav-icon { font-size: 18px; width: 24px; text-align: center; }

    .sidebar-footer {
      padding: 16px 12px;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .user-info {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px;
      background: rgba(255,255,255,.06);
    }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--primary); display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
    }
    .user-name { font-size: 13px; font-weight: 600; color: #fff; flex: 1; }
    .logout-btn {
      background: none; border: none; color: rgba(255,255,255,.5);
      cursor: pointer; font-size: 18px; padding: 2px;
      transition: color .15s;
    }
    .logout-btn:hover { color: var(--error); }

    /* ── Main ── */
    .main { margin-left: var(--sidebar); min-height: 100vh; }

    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 28px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-title { font-size: 17px; font-weight: 700; color: var(--text); }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }

    .content { padding: 28px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: all .15s; font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: var(--error-light); color: var(--error); }
    .btn-danger:hover { background: var(--error); color: #fff; }
    .btn-success { background: var(--success-light); color: var(--success); }
    .btn-ghost { background: var(--surface-alt); color: var(--text-2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Stats cards ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
    }
    .stat-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 800; }

    /* ── Table ── */
    .table-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .table-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .table-title { font-size: 15px; font-weight: 700; }
    .search-input {
      padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; color: var(--text); background: var(--surface-alt);
      outline: none; min-width: 220px;
    }
    .search-input:focus { border-color: var(--primary); }

    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 10px 16px; text-align: left; font-size: 12px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px;
      background: var(--surface-alt); border-bottom: 1px solid var(--border);
    }
    td { padding: 12px 16px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-alt); }

    .badge {
      display: inline-block; padding: 3px 9px; border-radius: 6px;
      font-size: 11px; font-weight: 600;
    }
    .badge-akademik { background: #D1FAE5; color: #065F46; }
    .badge-spor     { background: #FEF3C7; color: #92400E; }
    .badge-sosyal   { background: #EDE9FE; color: #5B21B6; }
    .badge-duyuru   { background: #FCE7F3; color: #9D174D; }
    .badge-genel    { background: #DBEAFE; color: #1D4ED8; }

    .table-actions { display: flex; gap: 6px; }

    .empty-row td { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }

    /* ── Pagination ── */
    .pagination { display: flex; align-items: center; gap: 8px; padding: 16px 20px; justify-content: flex-end; border-top: 1px solid var(--border); }
    .page-info { font-size: 13px; color: var(--text-muted); flex: 1; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border-radius: 16px;
      width: 100%; max-width: 560px; max-height: 90vh;
      overflow-y: auto;
      transform: scale(.96); transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: scale(1); }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 17px; font-weight: 700; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 8px; background: var(--surface-alt);
      border: 1px solid var(--border); cursor: pointer; font-size: 16px; color: var(--text-2);
    }
    .modal-close:hover { background: var(--border); }

    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
    .form-input, .form-select, .form-textarea {
      padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 14px; color: var(--text); background: var(--surface-alt);
      outline: none; font-family: inherit; transition: border-color .15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); background: #fff; }
    .form-textarea { resize: vertical; min-height: 120px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 18px; border-radius: 10px;
      font-size: 14px; font-weight: 600; color: #fff;
      z-index: 9999; transform: translateY(80px); opacity: 0;
      transition: all .3s; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--success); }
    .toast.error   { background: var(--error); }

    /* ── Loader ── */
    .loader { text-align: center; padding: 40px; color: var(--text-muted); }
    .spinner {
      width: 28px; height: 28px; border: 3px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Login page ── */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 40px; width: 100%; max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .login-logo { font-size: 52px; text-align: center; margin-bottom: 10px; }
    .login-title { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 4px; }
    .login-sub { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 28px; }
    .error-box {
      background: var(--error-light); color: var(--error);
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
      font-weight: 600; margin-top: 10px; display: none;
    }
  </style>
</head>
<body>

<!-- ── LOGIN ──────────────────────────────────────────────────────── -->
<div id="loginPage">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">🏛️</div>
      <h1 class="login-title">ISUBÜ</h1>
      <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:4px">Isparta Uygulamalı Bilimler Üniversitesi</p>
      <p class="login-sub">Akıllı Kampüs — Admin Paneli</p>

      <div class="form-field" style="margin-bottom:14px">
        <label class="form-label">E-posta</label>
        <input class="form-input" type="email" id="loginEmail" placeholder="admin@smartcampus.local" />
      </div>
      <div class="form-field" style="margin-bottom:4px">
        <label class="form-label">Şifre</label>
        <input class="form-input" type="password" id="loginPassword" placeholder="••••••••" />
      </div>

      <button class="btn btn-primary" id="loginBtn" style="width:100%;margin-top:16px;padding:12px;" onclick="doLogin()">Giriş Yap</button>
      <div class="error-box" id="loginError"></div>
    </div>
  </div>
</div>

<!-- ── DASHBOARD ──────────────────────────────────────────────────── -->
<div id="dashboardPage" style="display:none">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>🏛️</span>
      <div class="sidebar-logo-text">
        ISUBÜ
        <small>Akıllı Kampüs — Admin</small>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" onclick="showPage('announcements')" id="nav-announcements">
        <span class="nav-icon">📢</span> Duyurular
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userInitial">A</div>
        <span class="user-name" id="userName">Admin</span>
        <button class="logout-btn" title="Çıkış" onclick="doLogout()">⏏</button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <!-- Topbar -->
    <div class="topbar">
      <span class="topbar-title" id="topbarTitle">Duyurular</span>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="openCreateModal()">+ Yeni Duyuru</button>
      </div>
    </div>

    <!-- Content -->
    <div class="content" id="pageContent">
      <div class="loader"><div class="spinner"></div>Yükleniyor...</div>
    </div>
  </main>
</div>

<!-- ── MODALS ──────────────────────────────────────────────────────── -->

<!-- Create / Edit Modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Yeni Duyuru</span>
      <button class="modal-close" onclick="closeModal('formModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="formId" />
      <div class="form-field">
        <label class="form-label">Başlık *</label>
        <input class="form-input" id="formBaslik" placeholder="Duyuru başlığı..." />
      </div>
      <div class="form-field">
        <label class="form-label">Kategori *</label>
        <select class="form-select" id="formKategori">
          <option value="Akademik">Akademik</option>
          <option value="Etkinlik">Etkinlik</option>
          <option value="Spor">Spor</option>
          <option value="Sosyal">Sosyal</option>
          <option value="Kariyer">Kariyer</option>
          <option value="Uluslararası">Uluslararası</option>
          <option value="Genel">Genel</option>
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">İçerik *</label>
        <textarea class="form-textarea" id="formIcerik" placeholder="Duyuru içeriği..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('formModal')">İptal</button>
      <button class="btn btn-primary" id="formSaveBtn" onclick="saveAnnouncement()">Kaydet</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <span class="modal-title">Duyuruyu Sil</span>
      <button class="modal-close" onclick="closeModal('deleteModal')">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:14px;color:var(--text-2);line-height:1.6">
        "<strong id="deleteTitle"></strong>" başlıklı duyuruyu silmek istediğinize emin misiniz?
        Bu işlem geri alınamaz.
      </p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('deleteModal')">İptal</button>
      <button class="btn btn-danger" id="confirmDeleteBtn">Evet, Sil</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let token = localStorage.getItem('admin_token') || '';
let currentPage = 1;
let totalPages  = 1;
let allItems    = [];

// ── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  if (token) {
    showDashboard();
  }
  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});

// ── Auth ─────────────────────────────────────────────────────────────────────
async function doLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn      = document.getElementById('loginBtn');
  const errDiv   = document.getElementById('loginError');

  errDiv.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Giriş yapılıyor...';

  try {
    const res  = await api('/auth/login', 'POST', { email, password }, false);
    if (res.user?.role !== 'admin') throw new Error('Bu hesabın admin yetkisi yok.');
    token = res.token;
    localStorage.setItem('admin_token', token);
    localStorage.setItem('admin_name',  res.user.name);
    showDashboard();
  } catch (e) {
    errDiv.textContent   = e.message;
    errDiv.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Giriş Yap';
  }
}

function doLogout() {
  localStorage.removeItem('admin_token');
  localStorage.removeItem('admin_name');
  token = '';
  document.getElementById('loginPage').style.display = '';
  document.getElementById('dashboardPage').style.display = 'none';
}

function showDashboard() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('dashboardPage').style.display = '';
  const name = localStorage.getItem('admin_name') || 'Admin';
  document.getElementById('userName').textContent = name;
  document.getElementById('userInitial').textContent = name.charAt(0).toUpperCase();
  loadAnnouncements(1);
}

// ── API helper ───────────────────────────────────────────────────────────────
async function api(path, method = 'GET', body = null, auth = true) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && token) headers['Authorization'] = `Bearer ${token}`;

  const res = await fetch(`/api${path}`, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined
  });

  if (res.status === 401) { doLogout(); throw new Error('Oturum süresi doldu.'); }

  const text = await res.text();
  const data = text ? JSON.parse(text) : {};
  if (!res.ok) throw new Error(data.message || `Hata: ${res.status}`);
  return data;
}

// ── Announcements ─────────────────────────────────────────────────────────────
async function loadAnnouncements(page = 1) {
  currentPage = page;
  document.getElementById('topbarTitle').textContent = 'Duyurular';
  document.getElementById('pageContent').innerHTML = '<div class="loader"><div class="spinner"></div>Yükleniyor...</div>';

  try {
    const data = await api(`/admin/announcements?page=${page}&pageSize=15`);
    allItems   = data.items || [];
    totalPages = data.totalPages || 1;
    renderAnnouncementsTable(allItems, data.totalCount, page, totalPages);
  } catch (e) {
    document.getElementById('pageContent').innerHTML = `<p style="color:var(--error);padding:20px">${e.message}</p>`;
  }
}

function renderAnnouncementsTable(items, total, page, pages) {
  const searchVal = document.getElementById('annSearch')?.value || '';

  const statsHtml = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Toplam Duyuru</div>
        <div class="stat-value" style="color:var(--primary)">${total}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Bu Sayfada</div>
        <div class="stat-value" style="color:var(--success)">${items.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Sayfa</div>
        <div class="stat-value" style="color:var(--warning)">${page} / ${pages}</div>
      </div>
    </div>`;

  const rows = items.length === 0
    ? `<tr class="empty-row"><td colspan="4">📭 Henüz duyuru yok.</td></tr>`
    : items.map(a => `
        <tr>
          <td>
            <div style="font-weight:600;line-height:1.4;max-width:360px">${escHtml(a.baslik)}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:3px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(a.icerik)}</div>
          </td>
          <td><span class="badge ${badgeClass(a.kategori)}">${escHtml(a.kategori)}</span></td>
          <td style="white-space:nowrap;color:var(--text-muted);font-size:12px">${fmtDate(a.tarih)}</td>
          <td>
            <div class="table-actions">
              <button class="btn btn-ghost btn-sm" onclick="openEditModal(${a.id})">✏️ Düzenle</button>
              <button class="btn btn-danger btn-sm" onclick="openDeleteModal(${a.id},'${escHtml(a.baslik).replace(/'/g,"\\'")}')">🗑 Sil</button>
            </div>
          </td>
        </tr>`).join('');

  const tableHtml = `
    <div class="table-card">
      <div class="table-header">
        <span class="table-title">Tüm Duyurular</span>
        <input class="search-input" id="annSearch" placeholder="🔍  Başlık veya kategori ara..." value="${escHtml(searchVal)}" oninput="filterTable(this.value)" />
      </div>
      <table>
        <thead><tr>
          <th>BAŞLIK</th>
          <th>KATEGORİ</th>
          <th>TARİH</th>
          <th>İŞLEM</th>
        </tr></thead>
        <tbody id="tableBody">${rows}</tbody>
      </table>
      <div class="pagination">
        <span class="page-info">Toplam ${total} duyuru</span>
        <button class="btn btn-ghost btn-sm" onclick="loadAnnouncements(${page - 1})" ${page <= 1 ? 'disabled' : ''}>← Önceki</button>
        <button class="btn btn-ghost btn-sm" onclick="loadAnnouncements(${page + 1})" ${page >= pages ? 'disabled' : ''}>Sonraki →</button>
      </div>
    </div>`;

  document.getElementById('pageContent').innerHTML = statsHtml + tableHtml;
}

function filterTable(q) {
  const lower = q.toLowerCase();
  const filtered = allItems.filter(a =>
    a.baslik.toLowerCase().includes(lower) ||
    a.kategori.toLowerCase().includes(lower)
  );
  const rows = filtered.length === 0
    ? `<tr class="empty-row"><td colspan="4">🔍 Sonuç bulunamadı.</td></tr>`
    : filtered.map(a => `
        <tr>
          <td>
            <div style="font-weight:600;line-height:1.4;max-width:360px">${escHtml(a.baslik)}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:3px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(a.icerik)}</div>
          </td>
          <td><span class="badge ${badgeClass(a.kategori)}">${escHtml(a.kategori)}</span></td>
          <td style="white-space:nowrap;color:var(--text-muted);font-size:12px">${fmtDate(a.tarih)}</td>
          <td>
            <div class="table-actions">
              <button class="btn btn-ghost btn-sm" onclick="openEditModal(${a.id})">✏️ Düzenle</button>
              <button class="btn btn-danger btn-sm" onclick="openDeleteModal(${a.id},'${escHtml(a.baslik).replace(/'/g,"\\'")}')">🗑 Sil</button>
            </div>
          </td>
        </tr>`).join('');
  document.getElementById('tableBody').innerHTML = rows;
}

// ── Create / Edit ─────────────────────────────────────────────────────────────
function openCreateModal() {
  document.getElementById('formId').value      = '';
  document.getElementById('formBaslik').value  = '';
  document.getElementById('formKategori').value = 'Akademik';
  document.getElementById('formIcerik').value  = '';
  document.getElementById('modalTitle').textContent = '✨ Yeni Duyuru';
  document.getElementById('formSaveBtn').textContent = 'Yayınla';
  openModal('formModal');
}

async function openEditModal(id) {
  const item = allItems.find(a => a.id === id);
  if (!item) return;
  document.getElementById('formId').value       = id;
  document.getElementById('formBaslik').value   = item.baslik;
  document.getElementById('formKategori').value = item.kategori;
  document.getElementById('formIcerik').value   = item.icerik;
  document.getElementById('modalTitle').textContent  = '✏️ Duyuruyu Düzenle';
  document.getElementById('formSaveBtn').textContent = 'Güncelle';
  openModal('formModal');
}

async function saveAnnouncement() {
  const id       = document.getElementById('formId').value;
  const baslik   = document.getElementById('formBaslik').value.trim();
  const kategori = document.getElementById('formKategori').value;
  const icerik   = document.getElementById('formIcerik').value.trim();

  if (!baslik || !icerik) { showToast('Başlık ve içerik zorunludur.', 'error'); return; }

  const btn = document.getElementById('formSaveBtn');
  btn.disabled = true;

  try {
    if (id) {
      await api(`/admin/announcements/${id}`, 'PUT', { baslik, kategori, icerik });
      showToast('Duyuru güncellendi ✅', 'success');
    } else {
      await api('/admin/announcements', 'POST', { baslik, kategori, icerik });
      showToast('Duyuru yayınlandı ✅', 'success');
    }
    closeModal('formModal');
    loadAnnouncements(currentPage);
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

// ── Delete ────────────────────────────────────────────────────────────────────
let pendingDeleteId = null;

function openDeleteModal(id, title) {
  pendingDeleteId = id;
  document.getElementById('deleteTitle').textContent = title;
  document.getElementById('confirmDeleteBtn').onclick = confirmDelete;
  openModal('deleteModal');
}

async function confirmDelete() {
  if (!pendingDeleteId) return;
  const btn = document.getElementById('confirmDeleteBtn');
  btn.disabled = true;
  try {
    await api(`/admin/announcements/${pendingDeleteId}`, 'DELETE');
    showToast('Duyuru silindi.', 'success');
    closeModal('deleteModal');
    loadAnnouncements(currentPage);
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false;
    pendingDeleteId = null;
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function showPage(name) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`nav-${name}`)?.classList.add('active');
  if (name === 'announcements') loadAnnouncements(1);
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function escHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('tr-TR', { day:'numeric', month:'short', year:'numeric' });
}

function badgeClass(kat) {
  const k = (kat || '').toLowerCase();
  if (k.includes('akademik')) return 'badge-akademik';
  if (k.includes('spor'))     return 'badge-spor';
  if (k.includes('sosyal'))   return 'badge-sosyal';
  if (k.includes('duyuru'))   return 'badge-duyuru';
  return 'badge-genel';
}

// Modal dışına tıklayınca kapat
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});
</script>
</body>
</html>
